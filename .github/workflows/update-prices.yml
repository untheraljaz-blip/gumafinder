name: Osveži Awin cene
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: gumafinder-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prenesi in pretvori katalog
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python scripts/update_feed.py --output data
      - name: Objavi osvežene podatke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Samodejna posodobitev cen Awin"
            git push
          fi
